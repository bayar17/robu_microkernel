# rc.conf - hello_initsys configuration
#
# shell: program to spawn as PID 1's child (looked up by name in the rootfs).
# respawn: whether to spawn a fresh copy each time it exits.
# mount_services: whether to run mount_devfs/mount_procfs/mount_sysfs/mount_tmpfs
#   before the shell. These confirm the kernel-spawned devfs/ramfs/procfs/sysfs
#   servers are up; the kernel itself always spawns and mounts them.

shell = "sh"
respawn = true
mount_services = true
