name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm make flex bison mtools e2fsprogs qemu-system-x86 meson libc++-dev libc++abi-dev

      - name: Build kernel disk image
        run: |
          make BUILD_SYS=clang all
          make BUILD_SYS=clang bootloader-kernel-disk

      - name: Test boot in QEMU
        run: |
          truncate -s 16M build/diskfs.img
          timeout 8s qemu-system-x86_64 \
            -drive file=build/robu-kernel-disk.img,format=raw -boot c \
            -drive file=build/diskfs.img,format=raw,if=none,id=blk0 \
            -device virtio-blk-pci,drive=blk0 \
            -nographic \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 || code=$?
          echo "QEMU exit code: ${code:-0}"

      - name: Upload Kernel Disk Image
        uses: actions/upload-artifact@v4
        with:
          name: robu-kernel-disk.img
          path: build/robu-kernel-disk.img

      - name: Upload Kernel Binary
        uses: actions/upload-artifact@v4
        with:
          name: robu_kernel
          path: build/robu_kernel
